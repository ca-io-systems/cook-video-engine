[package]
name = "concat-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What the engine does with a mask: reading it from the project's cache, painting strokes over it, and cutting a frame with the result."

# This fork carries no inference. Masks are found elsewhere and imported
# into the project's cache (see concat-host's cutout module); this crate
# reads them, corrects them and cuts with them.
[dependencies]
concat-core.workspace = true
concat-project.workspace = true
# Masks on disk are eight-bit grey PNGs: a tenth the size of raw bytes, and
# a file anyone can open to see what was found.
png = "0.17"

[lints]
workspace = true
