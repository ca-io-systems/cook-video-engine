name: CI

# The headless engine only: this fork has no window, no phone build and no
# models. Mirrors what upstream's "Engine tests and lints" job checks.
on:
  push:
    branches: [cook/white-mantis]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests and lints
    runs-on: ubuntu-latest
    env:
      FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      # cpal needs ALSA; bindgen needs libclang.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libclang-dev
      # The FFmpeg bindings need 8.1 headers and shared libraries; FFMPEG_DIR
      # tells them where, and the tests find the libraries on the path.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          {
            echo "FFMPEG_DIR=$PWD/ffmpeg-dev"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib"
          } >> "$GITHUB_ENV"
          echo "$PWD/ffmpeg-dev/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
        working-directory: src
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src
      - run: cargo test --workspace -j 2
        working-directory: src
      # The gRPC transport is a feature nothing else turns on.
      - run: cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings
        working-directory: src
      # No build of this fork may link an inference runtime or a downloader.
      - name: No inference or download crates in the build
        working-directory: src
        run: |
          set -euo pipefail
          if cargo tree --workspace --prefix none | grep -E '^(ort|ort-sys|whisper-rs|whisper-rs-sys|sherpa-onnx|sherpa-onnx-sys|ureq) '; then
            echo "an inference or download crate is back in the dependency tree" >&2
            exit 1
          fi
      - name: End to end through the API
        run: |
          set -euo pipefail
          cargo build --release -p concat-cli --manifest-path src/Cargo.toml
          ffmpeg -nostdin -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=12" \
            -f lavfi -i "sine=frequency=440:duration=12" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest footage.mp4
          python3 cook/e2e/engine_e2e.py --cli src/target/release/concat-cli --footage footage.mp4 --out e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-e2e
          path: |
            e2e-out/report.json
            e2e-out/*.png
            e2e-out/document.json
          if-no-files-found: ignore
